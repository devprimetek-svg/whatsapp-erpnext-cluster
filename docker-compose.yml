version: "3.8"

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: reverse_proxy_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - WA_GATEWAY_DOMAIN=${WA_GATEWAY_DOMAIN}
      - WA_MANAGER_DOMAIN=${WA_MANAGER_DOMAIN}
      - N8N_DOMAIN=${N8N_DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - cluster_net
    depends_on:
      - evolution_api
      - evolution_manager
      - n8n

  postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evolution_db}
      POSTGRES_USER: ${POSTGRES_USER:-evolution_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TIMEZONE:-Asia/Kolkata}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cluster_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evolution_user} -d ${POSTGRES_DB:-evolution_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    environment:
      TZ: ${TIMEZONE:-Asia/Kolkata}
    volumes:
      - redis_data:/data
    networks:
      - cluster_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution_api:
    image: evoapicloud/evolution-api:v2.2.2
    container_name: evolution_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_NAME: evolution
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: https://${WA_GATEWAY_DOMAIN}
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-evolution_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evolution_db}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      DATABASE_SAVE_IS_ON_WHATSAPP: "true"
      DATABASE_SAVE_IS_ON_WHATSAPP_DAYS: 7
      DATABASE_DELETE_MESSAGE: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      DEL_INSTANCE: "false"
      LOG_LEVEL: "ERROR,WARN,INFO"
      LOG_COLOR: "true"
      LOG_BAILEYS: "error"
      CORS_ORIGIN: "*"
      CORS_METHODS: "GET,POST,PUT,DELETE"
      CORS_CREDENTIALS: "true"
      TZ: ${TIMEZONE:-Asia/Kolkata}
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - cluster_net

  evolution_manager:
    image: evoapicloud/evolution-manager:latest
    container_name: evolution_manager
    restart: always
    depends_on:
      - evolution_api
    networks:
      - cluster_net

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_orchestrator
    restart: always
    environment:
      GENERIC_TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      TZ: ${TIMEZONE:-Asia/Kolkata}
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GLOBAL_OPERATIONAL_WA_NO: ${GLOBAL_OPERATIONAL_WA_NO:-erpnext_support}
      WA_INSTANCE_ERPNEXT: ${WA_INSTANCE_ERPNEXT:-erpnext_support}
      WA_INSTANCE_PRIMETEK: ${WA_INSTANCE_PRIMETEK:-primetek_store}
      PRIMETEK_GATEWAY_API_KEY: ${PRIMETEK_GATEWAY_API_KEY:-primetek_sec_change_in_env}
      UNIVERSAL_GATEWAY_API_KEY: ${UNIVERSAL_GATEWAY_API_KEY:-gateway_sec_change_me_in_env}
      WEBAPP_WEBHOOK_URL: ${WEBAPP_WEBHOOK_URL:-}
      GCP_TRANSLATION_API_KEY: ${GCP_TRANSLATION_API_KEY:-}
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:-}
      N8N_PAYLOAD_SIZE_MAX: 16
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - cluster_net

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  evolution_instances:
  n8n_data:

networks:
  cluster_net:
    driver: bridge
